    <!-- APPLICATION ENGINE SCRIPT -->
    <script>
        /**
         * SmartSave Banking Core Engine (v2.6.0)
         */
        const CONFIG = {
            SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzeGO2XhMgVXAKDYVY2o-ntcLbgBEO0pMrCh7pdRxwOq23esodk_0UMD94USWwlWfR-/exec',
            SHEET_ID: '1nXTCNdVJRpDuIunPLnjqMkUzmOA87gtUqoclBIgNObk',
            MAINTENANCE_START: 23, // 23:00
            MAINTENANCE_END: 23.5  // 23:30
        };

        // IndexedDB Wrapper for high integrity local storage
        class DatabaseAdapter {
            constructor() {
                this.dbName = 'SmartSaveDB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('savings')) {
                            db.createObjectStore('savings', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('goals')) {
                            db.createObjectStore('goals', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('pending')) {
                            db.createObjectStore('pending', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('notifications')) {
                            db.createObjectStore('notifications', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = (e) => reject(e);
                });
            }

            async getAll(storeName) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                });
            }

            async put(storeName, item) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.put(item);
                    tx.oncomplete = () => resolve();
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                });
            }
        }

        class SmartSaveApp {
            constructor() {
                this.db = new DatabaseAdapter();
                this.currentUser = JSON.parse(localStorage.getItem('smart_user')) || null;
                this.categories = JSON.parse(localStorage.getItem('smart_categories')) || ['ออมเงินประจำวัน', 'เงินโบนัส', 'เงินทอน', 'การลงทุน', 'อื่นๆ'];
                this.favorites = JSON.parse(localStorage.getItem('smart_favorites')) || [];
                this.currentTab = 'home';
                this.mediaStream = null;
                this.capturedFaceImage = null;
            }

            async start() {
                await this.db.init();
                this.checkMaintenanceWindow();
                setInterval(() => this.checkMaintenanceWindow(), 60000);

                if (!this.currentUser) {
                    this.renderAuth();
                } else {
                    this.renderAppShell();
                    this.navigate('home');
                    this.syncWithBackend();
                }
            }

            checkMaintenanceWindow() {
                const now = new Date();
                const hours = now.getHours() + (now.getMinutes() / 60);
                const banner = document.getElementById('maintenance-banner');
                if (hours >= CONFIG.MAINTENANCE_START && hours < CONFIG.MAINTENANCE_END) {
                    banner.classList.remove('hidden');
                    return true;
                } else {
                    banner.classList.add('hidden');
                    return false;
                }
            }

            // --- AUTHENTICATION & FACIAL REGISTER ---
            renderAuth(mode = 'login') {
                document.getElementById('top-bar').classList.add('hidden');
                document.getElementById('bottom-nav').classList.add('hidden');
                const main = document.getElementById('main-content');

                if (mode === 'login') {
                    main.innerHTML = `
                        <div class="min-h-[80vh] flex flex-col justify-center space-y-6">
                            <div class="text-center space-y-2">
                                <div class="w-16 h-16 bg-brand-600/20 text-brand-500 rounded-3xl flex items-center justify-center mx-auto text-2xl font-bold border border-brand-500/30">
                                    <i class="fa-solid fa-vault"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-white">SmartSave Banking</h1>
                                <p class="text-xs text-slate-400">ระบบบริหารการออมเงินส่วนบุคคลระดับมืออาชีพ</p>
                            </div>

                            <form onsubmit="app.handleLogin(event)" class="glass-panel p-6 rounded-3xl space-y-4">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">ชื่อผู้ใช้งาน</label>
                                    <input type="text" id="login-username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="Username">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">รหัสผ่าน</label>
                                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
                                </button>
                            </form>

                            <div class="text-center">
                                <button onclick="app.renderAuth('register')" class="text-xs text-brand-500 hover:underline">ยังไม่มีบัญชี? ลงทะเบียนเข้าใช้งานครั้งแรก</button>
                            </div>
                        </div>
                    `;
                } else {
                    main.innerHTML = `
                        <div class="min-h-[85vh] flex flex-col justify-center space-y-4 my-4">
                            <div class="text-center space-y-1">
                                <h1 class="text-xl font-bold text-white">ลงทะเบียนผู้ใช้งานใหม่</h1>
                                <p class="text-xs text-slate-400">ยืนยันตัวตนด้วยใบหน้าสำหรับสิทธิ์ 1 User</p>
                            </div>

                            <form onsubmit="app.handleRegister(event)" class="glass-panel p-5 rounded-3xl space-y-3">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">ชื่อ-นามสกุล หรือ ชื่อเรียก</label>
                                    <input type="text" id="reg-fullname" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                                    <input type="text" id="reg-username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">รหัสผ่าน</label>
                                    <input type="password" id="reg-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                                </div>

                                <!-- Camera Facial Verification -->
                                <div class="space-y-2 pt-2 border-t border-slate-800">
                                    <label class="block text-xs font-semibold text-brand-400">การยืนยันตัวตนด้วยใบหน้า (เปิดกล้องถ่ายภาพ)</label>
                                    <div class="relative w-full h-48 bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                                        <video id="webcam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                                        <img id="photo-preview" class="w-full h-full object-cover hidden">
                                        <div id="camera-placeholder" class="text-center text-slate-500">
                                            <i class="fa-solid fa-camera text-2xl mb-1"></i>
                                            <p class="text-xs">กดปุ่มเพื่อเปิดกล้อง</p>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button type="button" onclick="app.startCamera()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 rounded-xl">เปิดกล้อง</button>
                                        <button type="button" onclick="app.captureCamera()" class="flex-1 py-2 bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white rounded-xl">ถ่ายภาพใบหน้า</button>
                                    </div>
                                </div>

                                <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-lg transition">ยืนยันการลงทะเบียน</button>
                            </form>

                            <div class="text-center">
                                <button onclick="app.renderAuth('login')" class="text-xs text-slate-400 hover:underline">ย้อนกลับไปหน้าเข้าสู่ระบบ</button>
                            </div>
                        </div>
                    `;
                }
            }

            async startCamera() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const video = document.getElementById('webcam');
                    video.srcObject = this.mediaStream;
                    video.classList.remove('hidden');
                    document.getElementById('camera-placeholder').classList.add('hidden');
                    document.getElementById('photo-preview').classList.add('hidden');
                } catch (err) {
                    alert('ไม่สามารถเข้าถึงกล้องถ่ายรูปได้ โปรดอนุญาตสิทธิ์การใช้กล้อง');
                }
            }

            captureCamera() {
                const video = document.getElementById('webcam');
                if (!this.mediaStream || video.classList.contains('hidden')) return;

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 320;
                canvas.height = video.videoHeight || 240;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                this.capturedFaceImage = canvas.toDataURL('image/jpeg', 0.6);

                const img = document.getElementById('photo-preview');
                img.src = this.capturedFaceImage;
                img.classList.remove('hidden');
                video.classList.add('hidden');

                // Stop tracks
                this.mediaStream.getTracks().forEach(track => track.stop());
            }

            handleLogin(e) {
                e.preventDefault();
                const user = document.getElementById('login-username').value.trim();
                const pass = document.getElementById('login-password').value;

                const savedUser = JSON.parse(localStorage.getItem('smart_user_db'));
                if (savedUser && savedUser.username === user && savedUser.password === pass) {
                    this.currentUser = savedUser;
                    localStorage.setItem('smart_user', JSON.stringify(savedUser));
                    this.renderAppShell();
                    this.navigate('home');
                    this.addNotification('เข้าสู่ระบบสำเร็จ', 'ยินดีต้อนรับเข้าสู่ SmartSave Banking');
                } else {
                    alert('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                }
            }

            handleRegister(e) {
                e.preventDefault();
                if (!this.capturedFaceImage) {
                    alert('โปรดทำการถ่ายรูปเพื่อยืนยันตัวตนก่อนลงทะเบียน');
                    return;
                }

                const fullname = document.getElementById('reg-fullname').value.trim();
                const username = document.getElementById('reg-username').value.trim();
                const password = document.getElementById('reg-password').value;

                const userObj = {
                    id: 'usr_' + Date.now(),
                    fullname,
                    username,
                    password, // In production, hash this
                    verifiedFace: true,
                    registeredAt: new Date().toISOString()
                };

                localStorage.setItem('smart_user_db', JSON.stringify(userObj));
                localStorage.setItem('smart_user', JSON.stringify(userObj));
                this.currentUser = userObj;

                alert('ลงทะเบียนและยืนยันตัวตนเรียบร้อยแล้ว');
                this.renderAppShell();
                this.navigate('home');
                this.addNotification('ลงทะเบียนสำเร็จ', 'บัญชีของคุณถูกยืนยันด้วยใบหน้าเรียบร้อยแล้ว');
            }

            renderAppShell() {
                document.getElementById('top-bar').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                document.getElementById('header-user-name').innerText = this.currentUser.fullname;
                document.getElementById('header-avatar-initial').innerText = this.currentUser.fullname.charAt(0).toUpperCase();

                const now = new Date();
                const dateOptions = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
                document.getElementById('header-current-date').innerText = now.toLocaleDateString('th-TH', dateOptions);
            }

            // --- NAVIGATION CONTROLLER ---
            navigate(tab) {
                this.currentTab = tab;
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-brand-500'));
                const activeNav = document.getElementById(`nav-${tab}`);
                if (activeNav) activeNav.classList.add('text-brand-500');

                switch (tab) {
                    case 'home': this.renderHomeView(); break;
                    case 'saving': this.renderSavingFormView(); break;
                    case 'goals': this.renderGoalsView(); break;
                    case 'rank': this.renderRankView(); break;
                    case 'more': this.renderMoreMenuView(); break;
                    case 'analysis': this.renderAnalysisView(); break;
                    case 'settings': this.renderSettingsView(); break;
                    case 'pending': this.renderPendingView(); break;
                    case 'history': this.renderHistoryView(); break;
                    case 'calendar': this.renderCalendarView(); break;
                }
            }

            // --- VIEWS ---

            async handleSaveTransaction(e) {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('save-amount').value);
                const date = document.getElementById('save-date').value;
                const time = document.getElementById('save-time').value;
                const type = document.getElementById('save-type').value;
                const category = document.getElementById('save-category').value;
                const note = document.getElementById('save-note').value;

                if (isNaN(amount) || amount <= 0) {
                    alert('กรุณาระบุจำนวนเงินที่ถูกต้อง');
                    return;
                }

                const transaction = {
                    id: 'sav_' + Date.now(),
                    amount,
                    date,
                    time,
                    type,
                    category,
                    note,
                    createdAt: new Date().toISOString()
                };

                const isMaintenance = this.checkMaintenanceWindow();

                if (isMaintenance) {
                    await this.db.put('pending', transaction);
                    this.addNotification('บันทึกในคิวชั่วคราว', `บันทึก ฿${amount} ไว้ในระบบส่วนดำเนินการแล้ว`);
                    alert('ระบบอยู่ในช่วงเวลาปิดประมวลผล (23:00-23:30 น.) ได้ทำการบันทึกไว้ในหน้าข้อมูลส่วนดำเนินการเรียบร้อยแล้ว');
                } else {
                    await this.db.put('savings', transaction);
                    this.addNotification('บันทึกสำเร็จ', `ออมเงินจำนวน ฿${amount} เรียบร้อยแล้ว`);
                    this.syncItemToGoogleSheet(transaction);
                }

                this.navigate('home');
            }

                        <h2 class="text-lg font-bold text-white">ตั้งค่าระบบ</h2>

                        <!-- SECURITY & SYNC INFO (Codes Hidden) -->
                        <div class="glass-panel p-4 rounded-2xl space-y-2 border border-slate-800">
                            <h3 class="text-xs font-bold text-slate-300">ความปลอดภัยและการเชื่อมต่อ</h3>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">สถานะการเชื่อมต่อฐานข้อมูล</span>
                                <span class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> ซิงค์อัตโนมัติเปิดใช้งาน</span>
                            </div>
                        </div>

                        <!-- CATEGORIES EDIT -->
                        <div class="glass-panel p-4 rounded-2xl space-y-3 border border-slate-800">
                            <h3 class="text-xs font-bold text-slate-300">จัดการหมวดหมู่บันทึกการออม</h3>
                            <div class="flex gap-2">
                                <input type="text" id="new-cat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="เพิ่มหมวดหมู่ใหม่">
                                <button onclick="app.addCategory()" class="px-3 py-2 bg-brand-600 text-xs font-medium text-white rounded-xl">เพิ่ม</button>
                            </div>
                            <div class="flex flex-wrap gap-2 pt-2">
                                ${this.categories.map((c, index) => `
                                    <span class="bg-slate-800 text-xs px-2.5 py-1 rounded-lg text-slate-300 flex items-center gap-1.5">
                                        ${c}
                                        <i onclick="app.removeCategory(${index})" class="fa-solid fa-xmark cursor-pointer text-slate-500 hover:text-rose-400"></i>
                                    </span>
                                `).join('')}
                            </div>
                        </div>

                        <button onclick="app.logout()" class="w-full py-3 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 text-xs font-medium rounded-xl transition">
                            ออกจากระบบ
                        </button>
                    </div>
                `;
            }

            addCategory() {
                const input = document.getElementById('new-cat-input');
                const val = input.value.trim();
                if (val && !this.categories.includes(val)) {
                    this.categories.push(val);
                    localStorage.setItem('smart_categories', JSON.stringify(this.categories));
                    this.renderSettingsView();
                }
            }

            removeCategory(index) {
                this.categories.splice(index, 1);
                localStorage.setItem('smart_categories', JSON.stringify(this.categories));
                this.renderSettingsView();
            }

            // --- UTILITIES & NOTIFICATIONS ---
            addNotification(title, message) {
                const notif = {
                    id: 'ntf_' + Date.now(),
                    title,
                    message,
                    time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                    read: false
                };
                this.db.put('notifications', notif);
                document.getElementById('unread-dot').classList.remove('hidden');
            }

            calculateStreak(savings) {
                if (savings.length === 0) return 0;
                const dates = [...new Set(savings.map(s => s.date))].sort().reverse();
                let streak = 0;
                let checkDate = new Date();

                for (let d of dates) {
                    const dateObj = new Date(d);
                    const diffDays = Math.floor((checkDate - dateObj) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 1) {
                        streak++;
                        checkDate = dateObj;
                    } else break;
                }
                return streak;
            }

            showModal(id) {
                document.getElementById('modal-overlay').classList.remove('hidden');
                document.getElementById(id).classList.remove('hidden');
                if (id === 'notifications-modal') this.loadNotifications();
            }

            closeModal(id) {
                document.getElementById('modal-overlay').classList.add('hidden');
                document.getElementById(id).classList.add('hidden');
            }

            async loadNotifications() {
                const list = await this.db.getAll('notifications');
                const container = document.getElementById('notifications-list');
                document.getElementById('unread-dot').classList.add('hidden');

                if (list.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">ไม่มีการแจ้งเตือน</p>`;
                    return;
                }
                container.innerHTML = list.reverse().map(n => `
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-800 space-y-1">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-white">${n.title}</h4>
                            <span class="text-[10px] text-slate-500">${n.time}</span>
                        </div>
                        <p class="text-xs text-slate-400">${n.message}</p>
                    </div>
                `).join('');
            }

            openFavoriteModal() {
                const select = document.getElementById('fav-category');
                select.innerHTML = this.categories.map(c => `<option value="${c}">${c}</option>`).join('');
                this.showModal('favorite-modal');
            }

            saveFavorite(e) {
                e.preventDefault();
                const fav = {
                    id: 'fav_' + Date.now(),
                    title: document.getElementById('fav-title').value.trim(),
                    amount: parseFloat(document.getElementById('fav-amount').value),
                    category: document.getElementById('fav-category').value
                };
                this.favorites.push(fav);
                localStorage.setItem('smart_favorites', JSON.stringify(this.favorites));
                this.closeModal('favorite-modal');
                this.renderHomeView();
            }

            quickSaveFromFavorite(id) {
                const fav = this.favorites.find(f => f.id === id);
                if (!fav) return;

                const now = new Date();
                const transaction = {
                    id: 'sav_' + Date.now(),
                    amount: fav.amount,
                    date: now.toISOString().split('T')[0],
                    time: now.toTimeString().split(' ')[0].substring(0, 5),
                    type: 'Daily Saving',
                    category: fav.category,
                    note: 'จากรายการโปรด: ' + fav.title,
                    createdAt: now.toISOString()
                };

                this.db.put('savings', transaction);
                this.syncItemToGoogleSheet(transaction);
                this.addNotification('บันทึกสำเร็จ', `ออมเงินรายการโปรด ฿${fav.amount} เรียบร้อยแล้ว`);
                this.renderHomeView();
            }

            async syncItemToGoogleSheet(item) {
                try {
                    fetch(CONFIG.SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                } catch (e) {
                    console.error("Backend Sync error", e);
                }
            }

            async syncWithBackend() {
                // Background Sync Strategy
            }

            logout() {
                localStorage.removeItem('smart_user');
                this.currentUser = null;
                this.renderAuth();
            }
        }

        const app = new SmartSaveApp();
        window.onload = () => app.start();
    </script>
</body>
</html>
